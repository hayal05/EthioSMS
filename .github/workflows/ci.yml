name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ethiosms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pilot -d ethiosms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pilot:ci-only-password@localhost:5432/ethiosms_test
      REQUIRE_DATABASE_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
